<!-- DELETE MODAL -->
<dialog #deleteModal class="modal">
    <div class="modal-box">
        <h3 class="text-lg font-bold">Auto entfernen?</h3>
        <p class="py-4">
            Bitte bestätigen Sie, dass <b>{{ carToDelete.name }}</b> nicht zu
            gebrauchen ist.
        </p>
        <div class="modal-action">
            <form method="dialog">
                <div class="flex gap-1">
                    <button
                        class="btn btn-primary"
                        (click)="onRemoveCar(carToDelete.id)"
                    >
                        {{ carToDelete.name }} ist schrottreif
                    </button>
                    <button class="btn btn-secondary">Abbrechen</button>
                </div>
            </form>
        </div>
    </div>
</dialog>

@if (!loadingData) {
<!-- SEARCH BOX -->
<div class="flex items-center justify-center gap-2 w-full mb-4">
    <div class="flex-grow">
        <p-autocomplete
            #carSearch
            [suggestions]="cars"
            [forceSelection]="true"
            [placeholder]="'Auto suchen'"
            (input)="onSearchChange($event)"
            optionLabel="name"
            class="w-full"
        >
            <ng-template let-car>
                <div class="flex justify-start gap-2">
                    <span class="text-sm">{{ car.name }}</span>
                </div>
            </ng-template>
        </p-autocomplete>
    </div>
    <!-- ADD CAR -->
    <button
        class="btn btn-sm btn-circle btn-primary"
        (click)="onAddCar(carSearch.value, carSearch)"
        [disabled]="!carSearch.value"
        title="Auto hinzufügen"
    >
        <mat-icon
            aria-hidden="false"
            aria-label="Add member"
            fontIcon="add"
        ></mat-icon>
    </button>
</div>
