<div class="flex flex-col justify-center items-center h-full">
    <div class="card bg-base-100 max-w-sm shrink-0 shadow-2xl">
        <form class="card-body">
            <div class="flex justify-center items-center">
                <img
                    src="/assets/packmaswbg.png"
                    alt="Logo"
                    class="w-32 h-auto"
                />
            </div>
            <p class="pb-2 text-center">
                Gruppe erstellen und Link mit allen Mitstreitern teilen
            </p>
            <div class="form-control">
                <label class="label">
                    <span class="label-text">Gruppenname</span>
                </label>
                <input
                    #groupNameInput
                    type="text"
                    placeholder="Die Woodys"
                    class="input input-bordered"
                    [(ngModel)]="groupName"
                    name="groupName"
                />
            </div>
            <div class="form-control mt-1">
                @if(loadingData) {
                <span class="loading loading-spinner loading-sm"></span>

                } @else {
                <button
                    class="btn btn-primary"
                    (click)="registerGroup()"
                    [disabled]="!groupNameInput.value"
                >
                    Neue Gruppe erstellen
                </button>
                }
            </div>
        </form>
    </div>
</div>
