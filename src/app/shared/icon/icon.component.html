@switch (type) { @case ('CAR') {
    <div
        class="w-6 h-6 rounded-full bg-secondary grid place-items-center"
        [ngStyle]="{ 'background-color': backGroundcolor }"
    >
        <div
            class="text-xs font-bold"
            [ngStyle]="{ color: getContrastColor(backGroundcolor) }"
        >
            {{ abbreviation }}
        </div>
    </div>
    } @case ('THING') {
    <div class="w-6 h-6 rounded-full bg-primary grid place-items-center">
        <div class="text-white text-xs font-bold">{{ abbreviation }}</div>
    </div>
    } @case ('MEMBER') {
    <div class="avatar">
        <div class="w-6 rounded-xl">
            @if(avatarNumber) {
            <img
                [src]="'assets/images/avatars/' + avatarNumber + 'thumbnail.jpg'"
                alt="Avatar"
            />
            } @else {
            <img [src]="'assets/images/avatars/default.jpg'" alt="Avatar" />
            }
        </div>
    </div>
} @default { Default case. } }
