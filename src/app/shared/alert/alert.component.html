@if(isVisible) {
<div
    [@pulseAnimation]
    role="alert"
    class="alert fixed top-20 w-auto right-4 z-50 shadow-lg"
    [ngClass]="{
        'alert-success': type === 'success',
        'alert-warning': type === 'warning',
        'alert-error': type === 'error'
    }"
>
    <mat-icon
        aria-hidden="false"
        aria-label="Example home icon"
        [fontIcon]="icon"
    ></mat-icon>
    <span>{{ message }}</span>
    <button (click)="toggleVisibility()">
        <mat-icon
            aria-hidden="false"
            aria-label="Example home icon"
            [fontIcon]="'close'"
        ></mat-icon>
    </button>
</div>
}
